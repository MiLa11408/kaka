<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8fd0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="祝雪溪">
<title>祝雪溪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene"></canvas>

<!-- ---------- 主界面 ---------- -->
<div id="main" class="screen hidden">
  <header>
    <div class="brand">祝雪溪</div>
    <div class="hdr-right">
      <div class="streak" id="h-streak-box" title="今日目标"><b id="h-streak">0</b><span>连续打卡</span></div>
      <button id="h-avatar" title="我"><img id="h-avatar-img" alt="我"></button>
    </div>
  </header>

  <aside id="friends"></aside>

  <img id="pig" src="assets/pig.gif" alt="我的猪" draggable="false">
  <div id="bubble" class="hidden"></div>
  <div id="zzz" class="hidden">z&nbsp;z</div>

  <button id="seed-btn" class="chip hidden">🌱 种子 <b id="seed-n">0</b></button>
  <div id="feed"></div>
  <div id="plant-tip" class="hidden">点一下地，选个位置种下 <button id="plant-cancel">算了</button></div>

  <footer id="dock">
    <button id="b-draw" class="dk draw"><b>抽一只</b><i id="d-sub">今天免费</i></button>
    <button id="b-focus" class="dk focus"><b id="b-focus-t">专注</b><i id="f-sub">25 / 45 分钟</i></button>
    <button id="b-todo" class="dk todo"><b>待办</b><i id="t-sub">0 条</i></button>
    <button id="b-book" class="dk book"><b>图鉴</b><i id="k-sub">0 / 0</i></button>
  </footer>
</div>

<!-- ---------- 登录 ---------- -->
<div id="login" class="screen hidden">
  <div class="login-card">
    <img class="login-cover" src="assets/cover.jpg" alt="猪学习">
    <h1>祝雪溪</h1>
    <p>每天抽一只猪 · 专注换机会 · 和朋友一起坚持</p>
    <label>你的名字 <small>以后换手机，输名字就能找回收集</small></label>
    <input id="j-name" maxlength="12" placeholder="输名字" autocomplete="off">
    <label>站码 <small>朋友的站码；留空就自己开一个</small></label>
    <input id="j-code" maxlength="6" placeholder="可留空" autocomplete="off">
    <button id="j-go">进去</button>
    <div id="j-err"></div>
  </div>
</div>

<!-- ---------- 通用面板 ---------- -->
<div id="sheet-ov" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-hd"><h2 id="sheet-title"></h2><button class="x" id="sheet-x">✕</button></div>
    <div class="sheet-bd" id="sheet-bd"></div>
  </div>
</div>

<!-- ---------- 抽卡 ---------- -->
<div id="draw" class="overlay hidden">
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face back"><span>?</span></div>
      <div class="face front"><img id="c-img" alt=""><div class="c-meta"><div class="c-name" id="c-name"></div><div class="c-tag" id="c-tag"></div></div></div>
    </div>
    <div class="draw-hint" id="d-hint">抽…</div>
  </div>
</div>

<!-- ---------- 专注 ---------- -->
<div id="focus" class="overlay hidden">
  <div class="focus-box">
    <div class="f-label">专注中</div>
    <div class="f-time" id="f-time">25:00</div>
    <div class="f-tomato" id="f-tomato"></div>
    <div class="f-note" id="f-note">放下手机。猪在替你看着。</div>
    <div class="f-actions">
      <button id="f-min" class="btn">收起</button>
      <button id="f-stop" class="btn danger">放弃</button>
    </div>
  </div>
</div>

<!-- ---------- 图鉴：小球池 ---------- -->
<div id="pit-ov" class="overlay hidden">
  <canvas id="pit"></canvas>
  <div class="pit-hd"><b id="pit-n">0</b><span>只 · 点小球看大图</span><button class="x" id="pit-x">✕</button></div>
</div>

<!-- ---------- 大图 ---------- -->
<div id="viewer" class="overlay hidden">
  <div class="viewer-box">
    <img id="v-img" alt="">
    <div class="v-name" id="v-name"></div>
    <div class="v-sub" id="v-sub"></div>
    <button class="btn" id="v-close">关上</button>
  </div>
</div>

<div id="toast"></div>

<!-- ---------- 启动封面 ---------- -->
<div id="cover"><img src="assets/cover.jpg" alt=""><div>祝雪溪</div></div>

<script src="scene.js"></script>
<script src="balls.js"></script>
<script src="app.js"></script>
</body>
</html>
