<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style></head><body>
<svg id="s" width="100%" height="100%" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e8a34a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#e8a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="60%" stop-color="#0a0e13"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5c6b5f"/>
      <stop offset="100%" stop-color="#9fb8a8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- 地平线 -->
  <path d="M0 372 Q 128 356 256 368 T 512 360 L512 512 L0 512 Z" fill="#080b0f"/>
  <path d="M0 372 Q 128 356 256 368 T 512 360" fill="none" stroke="#2b3a40" stroke-width="1.5" opacity="0.55"/>

  <!-- 星 -->
  <circle cx="96" cy="112" r="2.2" fill="#cfd6dc" opacity="0.5"/>
  <circle cx="404" cy="86" r="1.8" fill="#cfd6dc" opacity="0.4"/>
  <circle cx="340" cy="176" r="1.5" fill="#cfd6dc" opacity="0.3"/>

  <!-- 花 -->
  <path d="M256 400 C 250 340 262 300 256 246" fill="none" stroke="url(#stem)" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 336 C 232 322 222 306 220 292" fill="none" stroke="#7d917f" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M256 316 C 280 302 290 288 292 274" fill="none" stroke="#7d917f" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>

  <!-- 光晕 -->
  <circle cx="256" cy="236" r="128" fill="url(#glow)"/>
  <circle cx="256" cy="236" r="62" fill="url(#glow)" opacity="0.85"/>

  <!-- 帷幕花瓣 -->
  <g fill="none" stroke="#dbe9ef" stroke-linecap="round" opacity="0.72">
    <path d="M256 236 C 226 268 212 300 208 322" stroke-width="3.2"/>
    <path d="M256 236 C 240 272 234 306 232 334" stroke-width="3.2"/>
    <path d="M256 236 C 256 274 256 310 256 340" stroke-width="3.2"/>
    <path d="M256 236 C 272 272 278 306 280 334" stroke-width="3.2"/>
    <path d="M256 236 C 286 268 300 300 304 322" stroke-width="3.2"/>
  </g>
  <path d="M256 236 C 226 268 212 300 208 322 M256 236 C 240 272 234 306 232 334 M256 236 C 256 274 256 310 256 340 M256 236 C 272 272 278 306 280 334 M256 236 C 286 268 300 300 304 322"
        fill="none" stroke="#9fc6d4" stroke-width="1" opacity="0.28"/>

  <!-- 冠 -->
  <circle cx="256" cy="234" r="8" fill="#fff4dc"/>
  <circle cx="256" cy="234" r="14" fill="#ffe9c4" opacity="0.35"/>
</svg>
</body></html>
