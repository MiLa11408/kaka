<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
.wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%, #161d26 0%, #0a0e14 62%, #05070a 100%)}
.pig{width:74%;height:74%;border-radius:50%;overflow:hidden;position:relative;
  box-shadow:0 0 0 3px rgba(232,163,74,.55), 0 0 44px rgba(232,163,74,.28)}
.pig img{width:100%;height:100%;object-fit:cover}
.pig::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 120%, rgba(232,163,74,.22), transparent 62%)}
</style></head><body><div class="wrap"><div class="pig"><img src="icon-src.jpg"></div></div></body></html>
